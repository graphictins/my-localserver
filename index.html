<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Portal</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .card { border: 1px solid #ccc; padding: 20px; width: 300px; margin-bottom: 20px; border-radius: 8px; }
    input, select, button { display: block; margin-bottom: 10px; width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Register</h2>
    <select id="regRole" onchange="toggleStudentField()">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">
    <input type="text" id="regStudentNum" placeholder="Student Number">
    <button onclick="register()">Register</button>
  </div>

  <div class="card">
    <h2>Login</h2>
    <select id="loginRole">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <h3 id="response"></h3>

  <script>
    function toggleStudentField() {
      const role = document.getElementById('regRole').value;
      document.getElementById('regStudentNum').style.display = role === 'student' ? 'block' : 'none';
    }

    async function register() {
      const role = document.getElementById('regRole').value;
      const email = document.getElementById('regEmail').value;
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPass').value;
      const student_number = document.getElementById('regStudentNum').value;

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, email, username, password, student_number })
      });
      document.getElementById('response').innerText = await res.text();
    }

    async function login() {
      const role = document.getElementById('loginRole').value;
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, username, password })
      });
      document.getElementById('response').innerText = await res.text();
    }
  </script>
</body>
</html>
